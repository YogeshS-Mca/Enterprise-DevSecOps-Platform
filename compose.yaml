services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: enterprise-devsecops-platform:1.0.1

    container_name: enterprise-devsecops-app

    restart: unless-stopped

    ports:
      - "5001:5000"

    networks:
      - monitoring-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest

    container_name: enterprise-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      app:
        condition: service_healthy

    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:latest

    container_name: enterprise-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: