apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-devsecops-app
  namespace: enterprise-devsecops
  labels:
    app: enterprise-devsecops-app
    app.kubernetes.io/name: enterprise-devsecops-app
    app.kubernetes.io/part-of: enterprise-devsecops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-devsecops-app

  template:
    metadata:
      labels:
        app: enterprise-devsecops-app
        app.kubernetes.io/name: enterprise-devsecops-app
        app.kubernetes.io/part-of: enterprise-devsecops-platform

    spec:
      containers:
        - name: enterprise-devsecops-app
          image: enterprise-devsecops-platform:1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL